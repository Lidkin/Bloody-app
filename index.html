<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таро Лидии Хаит</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Карта дня и расклад на три карты из колоды Bloody Feast Tarot. Card of the day and a three-card spread.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lidkin.github.io/bloody-tarot/">
<meta property="og:title" content="Bloody Feast Tarot — ты хочешь знать?">
<meta property="og:description" content="Карта дня и расклад на три карты из колоды Лидии Хаит. Card of the day and a three-card spread.">
<meta property="og:image" content="https://lidkin.github.io/bloody-tarot/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0c0303">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link rel="stylesheet" href="style.css?v=25">
</head>
<body class="noir">
<div class="glow"></div>
<canvas id="dust"></canvas>
<div class="vignette"></div>
<h1 class="title" data-i18n="heading">Таро «Кровавый пир» от Лидии Хаит</h1>
<!-- the open card's name and how it fell, in place of the title while its description is shown -->
<div class="card-head" id="cardHead"><h2 id="mName"></h2></div>
<!-- sound switched off until real card sounds are found (SOUND in app.js)
<button class="sound-btn" id="soundBtn" aria-label="Sound"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor" stroke="none"/><path class="wave" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9"/><path class="cross" d="M10.5 6l4 4M14.5 6l-4 4"/></svg></button>
-->
<div class="lang-switch" id="langSwitch"><button id="langBtn" aria-label="Language">EN</button></div>

<div class="scene" id="opening">
  <div class="velvet" id="velvet">
    <div class="deck-stack" id="deckStack">
      <div class="dcard"><img src="assets/card-back.png" alt=""><div class="paper"></div></div><div class="dcard"><img src="assets/card-back.png" alt=""><div class="paper"></div></div><div class="dcard"><img src="assets/card-back.png" alt=""><div class="paper"></div></div>
    </div>
  </div>
  <div class="spread-options" id="spreadOpts">
    <div class="opt-col"><button class="opt" data-mode="day" data-i18n="optDay">Карта дня</button><div class="ask-sub" id="askSub"></div></div>
    <button class="opt" data-mode="three" data-i18n="optThree">Три карты</button>
  </div>
  <div class="whisper" id="whisper" data-i18n="whisper">ты хочешь знать?</div>
</div>

<div class="scene" id="fanScreen" hidden>
  <div class="fan" id="fan">
    <div class="dim-overlay" id="dimOverlay"></div>
  </div>
  <div class="meaning-panel" id="meaningPanel">
    <span class="pos-label" id="mPos"></span>
    <span class="card-title" id="mTitle"></span>
    <p id="mText"></p>
    <div class="meaning-end">
      <span class="end-phrase" id="endPhrase" data-i18n="nowYouKnow">Теперь ты знаешь</span>
      <span class="end-rule" id="endRule"></span>
      <button class="finish-btn" id="finishBtn"><span class="fill">Завершить</span> <span class="fill arrow">→</span></button>
    </div>
  </div>
  <div class="meaning-panel finale" id="finale">
    <div class="f-card" id="fCard" hidden>
      <span class="pos-label" id="fPos"></span>
      <h2 id="fName"></h2>
      <span class="card-title" id="fTitle"></span>
      <p id="fText"></p>
    </div>
    <p class="summary" id="fSummary" hidden></p>
    <p id="fDeck"></p>
    <div class="finale-row">
      <a class="cta" id="etsyBtn" target="_blank" rel="noopener" data-i18n="etsy">Колода на Etsy</a>
      <span class="row-break"></span>
      <button class="return-btn" id="shareBtn">Поделиться</button>
      <button class="link-btn" id="gatherBtn">Собрать колоду</button>
      <button class="link-btn" id="againBtn" hidden data-i18n="again">↺ Новое гадание</button>
    </div>
  </div>
  <button class="car-arrow" id="carPrev" aria-label="previous">‹</button><button class="car-arrow" id="carNext" aria-label="next">›</button>
  <div class="toast" id="toast"></div>
</div>
<div class="rotate-note"><span class="rot-ic">↻</span><span data-i18n="rotate">Поверни телефон вертикально</span></div>

<script src="app.js?v=25"></script>
</body>
</html>
