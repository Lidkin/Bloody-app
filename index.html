<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таро Лидии Хаит</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cinzel:wght@600;700&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow"></div>
<canvas id="dust"></canvas>
<div class="vignette"></div>
<h1 class="title">✦ Deck of Lidia Hayet ✦</h1>
<button class="theme-toggle" id="themeToggle"></button>

<div class="scene" id="opening">
  <div class="velvet" id="velvet">
    <div class="deck-stack" id="deckStack">
      <img src="assets/card-back.png" alt=""><img src="assets/card-back.png" alt=""><img src="assets/card-back.png" alt="">
    </div>
  </div>
  <button class="ask-btn" id="askBtn">✦ Задать вопрос ✦</button>
</div>

<div class="scene" id="fanScreen" hidden>
  <div class="spread-options" id="spreadOpts">
    <span class="opt active" data-mode="day">Карта дня</span>
    <span class="opt" data-mode="three">Три карты</span>
    <span class="opt" data-mode="cross">Кельтский крест</span>
  </div>
  <div class="fan" id="fan">
    <div class="dim-overlay" id="dimOverlay"></div>
  </div>
  <div class="meaning-panel" id="meaningPanel">
    <h2 id="mName"></h2>
    <span class="orient" id="mOrient"></span>
    <p id="mText"></p>
    <button class="return-btn" id="returnBtn">↺ Вернуть в колоду</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
