<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I THE MAGICIAN — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root {
      --card-w: min(46vw, 268px);
      --card-h: calc(var(--card-w) * 1.55);
      --blood: #e10600;
      --ink: #f4ebe0;
      --muted: rgba(244, 235, 224, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      font-family: "Special Elite", "Courier New", monospace;
      background:
        radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.72) 100%),
        center / cover no-repeat url("./assets/altar-cloth.png"),
        #050505;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 42%, transparent 18%, rgba(0,0,0,0.55) 100%);
      z-index: 0;
    }

    .hint {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: clamp(0.7rem, 2vw, 0.85rem);
      color: var(--muted);
      transition: opacity 0.4s ease;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      max-width: 90vw;
    }
    .hint.hidden { opacity: 0; pointer-events: none; }

    .scene {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: grid;
      place-items: center;
      perspective: 1400px;
    }

    /* —— Deck —— */
    .deck {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      border: 0;
      background: transparent;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.25s ease;
    }
    .deck:hover:not(:disabled) { transform: translateY(-4px) scale(1.02); }
    .deck:disabled { cursor: default; }

    .deck-layer {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: #fff center / cover no-repeat url("./assets/card-back.png");
      box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    }
    .deck-layer:nth-child(1) { transform: translate(10px, 10px); opacity: 0.55; }
    .deck-layer:nth-child(2) { transform: translate(6px, 6px); opacity: 0.75; }
    .deck-layer:nth-child(3) { transform: translate(3px, 3px); opacity: 0.9; }
    .deck-layer.top {
      transform: none;
      z-index: 2;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 14px 36px rgba(0,0,0,0.65);
    }
    .deck.is-drawing .deck-layer.top { opacity: 0; transition: opacity 0.15s; }

    /* —— Drawn card —— */
    .drawn {
      position: fixed;
      left: 50%;
      top: 46%;
      width: var(--card-w);
      height: var(--card-h);
      margin: calc(var(--card-h) / -2) 0 0 calc(var(--card-w) / -2);
      transform-style: preserve-3d;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.7);
    }

    .face.back {
      background: #fff center / cover no-repeat url("./assets/card-back.png");
    }

    .face.front {
      transform: rotateY(180deg);
      background: #111;
    }

    .face.front .art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
    }

    .drawn.reversed .face.front {
      transform: rotateY(180deg) rotateZ(180deg);
    }

    /* Blood overlay on revealed card */
    .blood-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease 0.15s;
    }
    .drawn.alive .blood-layer { opacity: 1; }

    .drop {
      position: absolute;
      width: 10px;
      height: 14px;
      background: var(--blood);
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow:
        0 0 6px rgba(225, 6, 0, 0.65),
        inset -1px -2px 3px rgba(0,0,0,0.25);
      transform-origin: 50% 0%;
      animation: drip var(--dur, 2.4s) ease-in infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0.95;
      filter: saturate(1.15);
    }

    .drop::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 0;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, var(--blood), transparent);
      animation: trail var(--dur, 2.4s) ease-in infinite;
      animation-delay: var(--delay, 0s);
    }

    /* Positions tuned to Magician art (% of card) */
    .drop.d1 { left: 18%; top: 22%; --dur: 2.6s; --delay: 0s; width: 9px; height: 13px; }
    .drop.d2 { left: 22%; top: 28%; --dur: 3.1s; --delay: 0.4s; width: 7px; height: 11px; }
    .drop.d3 { left: 28%; top: 34%; --dur: 2.2s; --delay: 0.9s; width: 11px; height: 15px; }
    .drop.d4 { left: 74%; top: 24%; --dur: 2.8s; --delay: 0.2s; width: 8px; height: 12px; }
    .drop.d5 { left: 79%; top: 31%; --dur: 3.3s; --delay: 0.7s; width: 10px; height: 14px; }
    .drop.d6 { left: 70%; top: 48%; --dur: 2.5s; --delay: 1.1s; width: 8px; height: 12px; }
    .drop.d7 { left: 62%; top: 52%; --dur: 2.9s; --delay: 0.35s; width: 6px; height: 9px; }
    .drop.d8 { left: 36%; top: 18%; --dur: 3.4s; --delay: 1.4s; width: 7px; height: 10px; }

    .puddle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 35%, #ff2a1a 0%, var(--blood) 45%, #8b0000 100%);
      opacity: 0.55;
      filter: blur(0.4px);
      animation: pulse-puddle 3.2s ease-in-out infinite;
    }
    .puddle.p1 { left: 28%; bottom: 14%; width: 18%; height: 5%; animation-delay: 0s; }
    .puddle.p2 { left: 48%; bottom: 12%; width: 22%; height: 6%; animation-delay: 0.8s; }

    .splatter-glow {
      position: absolute;
      left: 38%;
      top: 5%;
      width: 24%;
      height: 10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(225,6,0,0.55) 0%, transparent 70%);
      animation: pulse-glow 2.8s ease-in-out infinite;
      mix-blend-mode: screen;
    }

    @keyframes drip {
      0%   { transform: translateY(0) scaleY(1); opacity: 0; }
      8%   { opacity: 1; }
      70%  { transform: translateY(42px) scaleY(1.15); opacity: 0.95; }
      100% { transform: translateY(70px) scaleY(1.35); opacity: 0; }
    }

    @keyframes trail {
      0%   { height: 0; opacity: 0; }
      20%  { height: 10px; opacity: 0.7; }
      70%  { height: 28px; opacity: 0.35; }
      100% { height: 40px; opacity: 0; }
    }

    @keyframes pulse-puddle {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50%      { transform: scale(1.08); opacity: 0.7; }
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50%      { transform: scale(1.18); opacity: 0.85; }
    }

    /* Subtle figure breath after reveal */
    .drawn.alive .face.front .art {
      animation: breath 4s ease-in-out infinite;
    }
    @keyframes breath {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.012); }
    }

    /* Meaning */
    .meaning {
      position: fixed;
      left: 50%;
      bottom: max(1.5rem, 5dvh);
      transform: translateX(-50%) translateY(8px);
      width: min(92vw, 440px);
      z-index: 20;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .meaning.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .meaning .roman {
      font-family: "Cormorant Unicase", serif;
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      color: var(--blood);
      margin-bottom: 0.25rem;
    }

    .meaning h1 {
      font-family: "Cormorant Unicase", serif;
      font-weight: 700;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
      text-shadow: 0 2px 16px rgba(0,0,0,0.9);
    }

    .meaning .badge {
      display: inline-block;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(225, 6, 0, 0.55);
      color: var(--blood);
      padding: 0.2rem 0.55rem;
      margin-bottom: 0.75rem;
      background: rgba(0,0,0,0.4);
    }

    .meaning .blurb {
      font-size: clamp(0.78rem, 2.2vw, 0.92rem);
      line-height: 1.45;
      color: var(--muted);
      margin-bottom: 0.65rem;
      text-shadow: 0 1px 10px rgba(0,0,0,0.9);
    }

    .meaning .reading {
      font-size: clamp(0.85rem, 2.4vw, 1rem);
      line-height: 1.4;
      color: var(--ink);
      text-shadow: 0 1px 10px rgba(0,0,0,0.9);
    }

    .reset {
      position: fixed;
      right: 1.1rem;
      bottom: 1.1rem;
      z-index: 25;
      appearance: none;
      border: 1px solid rgba(244, 235, 224, 0.28);
      background: rgba(0, 0, 0, 0.55);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.65rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, background 0.2s, border-color 0.2s;
    }
    .reset.show {
      opacity: 1;
      pointer-events: auto;
    }
    .reset:hover {
      background: rgba(225, 6, 0, 0.25);
      border-color: rgba(225, 6, 0, 0.65);
    }

    @media (max-width: 480px) {
      :root {
        --card-w: min(62vw, 220px);
      }
      .meaning { bottom: 4.5rem; }
    }
  </style>
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>
  <p class="hint" id="hint">Нажмите на колоду — вытяните карту</p>

  <div class="scene">
    <button class="deck" id="deck" type="button" aria-label="Вытянуть карту">
      <span class="deck-layer" aria-hidden="true"></span>
      <span class="deck-layer" aria-hidden="true"></span>
      <span class="deck-layer" aria-hidden="true"></span>
      <span class="deck-layer top" aria-hidden="true"></span>
    </button>
  </div>

  <div class="drawn" id="drawn" aria-hidden="true">
    <div class="face back"></div>
    <div class="face front">
      <img class="art" src="./assets/the-magician.png" alt="I THE MAGICIAN" draggable="false" />
      <div class="blood-layer" aria-hidden="true">
        <span class="splatter-glow"></span>
        <span class="drop d1"></span>
        <span class="drop d2"></span>
        <span class="drop d3"></span>
        <span class="drop d4"></span>
        <span class="drop d5"></span>
        <span class="drop d6"></span>
        <span class="drop d7"></span>
        <span class="drop d8"></span>
        <span class="puddle p1"></span>
        <span class="puddle p2"></span>
      </div>
    </div>
  </div>

  <aside class="meaning" id="meaning" aria-live="polite">
    <div class="roman">I</div>
    <h1>THE MAGICIAN</h1>
    <div class="badge" id="orientation">Upright</div>
    <p class="blurb">
      The surgeon of fate, manipulating tools, flesh, and truth.
      Mastery of skill, control, and transformation — or abuse of power.
    </p>
    <p class="reading" id="reading"></p>
  </aside>

  <button class="reset" id="reset" type="button">Вернуть карту</button>

  <script>
    const CARD = {
      name: "THE MAGICIAN",
      blurb:
        "The surgeon of fate, manipulating tools, flesh, and truth. Mastery of skill, control, and transformation — or abuse of power.",
      upright: "Willpower, resourcefulness, clever use of tools.",
      reversed: "Lies, trickery, exploitation."
    };

    const deck = document.getElementById("deck");
    const drawn = document.getElementById("drawn");
    const meaning = document.getElementById("meaning");
    const reading = document.getElementById("reading");
    const orientation = document.getElementById("orientation");
    const resetBtn = document.getElementById("reset");
    const hint = document.getElementById("hint");

    let busy = false;

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function setTransform(el, transform, transition) {
      el.style.transition = transition;
      el.style.transform = transform;
    }

    async function drawCard() {
      if (busy) return;
      busy = true;
      deck.disabled = true;
      deck.classList.add("is-drawing");
      hint.classList.add("hidden");

      const reversed = Math.random() < 0.5;
      drawn.classList.toggle("reversed", reversed);
      orientation.textContent = reversed ? "Reversed" : "Upright";
      reading.textContent = reversed ? CARD.reversed : CARD.upright;

      drawn.style.opacity = "1";
      drawn.setAttribute("aria-hidden", "false");
      setTransform(drawn, "translateY(0) scale(1) rotateY(0deg)", "none");
      void drawn.offsetWidth;

      // Lift off the deck
      setTransform(
        drawn,
        "translateY(-20%) scale(1.06) rotateY(0deg)",
        "transform 0.55s cubic-bezier(0.22, 0.82, 0.2, 1)"
      );
      await wait(560);

      // Flip face-up and approach the viewer
      setTransform(
        drawn,
        "translateY(-6%) scale(1.42) rotateY(180deg)",
        "transform 0.95s cubic-bezier(0.18, 0.75, 0.2, 1)"
      );
      await wait(980);

      drawn.classList.add("alive");
      meaning.classList.add("show");
      resetBtn.classList.add("show");
    }

    async function resetCard() {
      if (!busy) return;
      meaning.classList.remove("show");
      resetBtn.classList.remove("show");
      drawn.classList.remove("alive");

      setTransform(
        drawn,
        "translateY(18%) scale(0.88) rotateY(180deg)",
        "transform 0.45s ease, opacity 0.35s ease"
      );
      drawn.style.opacity = "0";
      await wait(420);

      drawn.classList.remove("reversed");
      drawn.setAttribute("aria-hidden", "true");
      setTransform(drawn, "translateY(0) scale(1) rotateY(0deg)", "none");
      deck.classList.remove("is-drawing");
      deck.disabled = false;
      hint.classList.remove("hidden");
      busy = false;
    }

    deck.addEventListener("click", drawCard);
    resetBtn.addEventListener("click", resetCard);

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        if (!busy) {
          e.preventDefault();
          drawCard();
        }
      }
      if (e.key === "Escape" && busy) resetCard();
    });
  </script>
</body>
</html>
