<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таро Лидии Хаит</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="noir">
<div class="glow"></div>
<canvas id="dust"></canvas>
<div class="vignette"></div>
<h1 class="title">Deck by Lidiia Khait</h1>
<button class="sound-btn" id="soundBtn" aria-label="Sound"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor" stroke="none"/><path class="wave" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9"/><path class="cross" d="M10.5 6l4 4M14.5 6l-4 4"/></svg></button>
<div class="lang-switch" id="langSwitch"><button data-lang="ru">RU</button><span>/</span><button data-lang="en">EN</button></div>

<div class="scene" id="opening">
  <div class="velvet" id="velvet">
    <div class="deck-stack" id="deckStack">
      <div class="dcard"><img src="assets/card-back.png" alt=""><div class="paper"></div></div><div class="dcard"><img src="assets/card-back.png" alt=""><div class="paper"></div></div><div class="dcard"><img src="assets/card-back.png" alt=""><div class="paper"></div></div>
    </div>
  </div>
  <div class="spread-options" id="spreadOpts">
    <button class="opt" data-mode="day" data-i18n="optDay">Карта дня</button>
    <button class="opt" data-mode="three" data-i18n="optThree">Три карты</button>
  </div>
  <div class="ask-sub" id="askSub"></div>
</div>

<div class="scene" id="fanScreen" hidden>
  <div class="fan" id="fan">
    <div class="dim-overlay" id="dimOverlay"></div>
  </div>
  <div class="meaning-panel" id="meaningPanel">
    <span class="pos-label" id="mPos"></span>
    <h2 id="mName"></h2>
    <span class="card-title" id="mTitle"></span>
    <span class="orient" id="mOrient"></span>
    <p id="mText"></p>
    <div class="meaning-end">
      <span class="end-phrase" id="endPhrase" data-i18n="nowYouKnow">Теперь ты знаешь</span>
      <span class="end-rule" id="endRule"></span>
      <button class="finish-btn" id="finishBtn"><span class="fill">Завершить</span> <span class="fill arrow">→</span></button>
    </div>
  </div>
  <div class="meaning-panel finale" id="finale">
    <div class="f-card" id="fCard" hidden>
      <span class="pos-label" id="fPos"></span>
      <h2 id="fName"></h2>
      <span class="card-title" id="fTitle"></span>
      <span class="orient" id="fOrient"></span>
      <p id="fText"></p>
    </div>
    <p class="summary" id="fSummary" hidden></p>
    <p id="fDeck"></p>
    <a class="cta" id="etsyBtn" target="_blank" rel="noopener" data-i18n="etsy">Колода на Etsy</a>
    <div class="finale-row">
      <button class="return-btn" id="shareBtn">Поделиться картой</button>
      <button class="link-btn" id="gatherBtn" data-i18n="gather">Собрать колоду</button>
      <button class="link-btn" id="againBtn" hidden data-i18n="again">↺ Новое гадание</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
